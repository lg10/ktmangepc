<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Device Scan</title>
    <style>
      html,
      body {
        margin: 0;
        background: hsl(0 0% 100%);
      }
      /* 原生闪屏：独立于 #app，Vue 挂载后就地接管，业务页就绪后淡出 */
      .kt-splash {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: flex;
        flex-direction: column;
        padding: 36px 32px 24px;
        background: hsl(0 0% 100%);
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        user-select: none;
      }
      .kt-splash .kt-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
      }
      .kt-splash h1 {
        margin: 0;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 5px;
        color: hsl(222.2 47.4% 11.2%);
      }
      .kt-splash .kt-slogan {
        margin: 8px 0 0;
        font-size: 11px;
        letter-spacing: 2px;
        color: hsl(215.4 16.3% 46.9%);
      }
      .kt-splash .kt-ver {
        font-size: 11px;
        color: hsl(215.4 16.3% 46.9% / 0.7);
      }
      .kt-splash .kt-bottom {
        margin-top: auto;
      }
      .kt-splash .kt-task {
        font-size: 12px;
        color: hsl(215.4 16.3% 46.9%);
      }
      .kt-splash .kt-bar {
        margin-top: 8px;
        height: 3px;
        border-radius: 999px;
        background: hsl(210 40% 96.1%);
        overflow: hidden;
      }
      .kt-splash .kt-bar > div {
        width: 6%;
        height: 100%;
        border-radius: 999px;
        background: hsl(222.2 47.4% 11.2% / 0.7);
        transition: width 0.45s ease;
      }
      .kt-splash .kt-logbox {
        margin-top: 8px;
        height: 16px;
        overflow: hidden;
      }
      .kt-splash .kt-logbox p {
        margin: 0;
        font-size: 10px;
        line-height: 16px;
        color: hsl(215.4 16.3% 46.9% / 0.45);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    </style>
  </head>
  <body>
    <!-- 原生闪屏（#app 之外）：JS 加载阶段显示真实状态，Vue 挂载后就地更新 -->
    <div id="kt-splash" class="kt-splash">
      <div class="kt-head">
        <div>
          <h1>KT Device Scan</h1>
          <p class="kt-slogan">酒店智能设备管理工具</p>
        </div>
        <span id="kt-splash-ver" class="kt-ver"></span>
      </div>
      <div class="kt-bottom">
        <div id="kt-splash-task" class="kt-task">正在启动…</div>
        <div class="kt-bar"><div id="kt-splash-bar-fill"></div></div>
        <div class="kt-logbox">
          <p id="kt-splash-log">正在加载界面资源…</p>
        </div>
      </div>
    </div>
    <div id="app"></div>
    <script>
      // 模块加载前的真实心跳日志：Vue 运行时未就绪期间每秒汇报等待时长，
      // 让“卡进度”有明确原因；main.ts 加载后会清除该心跳并接管。
      (function () {
        var log = document.getElementById("kt-splash-log");
        var bar = document.getElementById("kt-splash-bar-fill");
        var dev = location.protocol === "http:";
        var t0 = Date.now();
        function paint(text, p) {
          if (log) log.textContent = text;
          if (bar) bar.style.width = Math.min(Math.max(p, 6), 100) + "%";
        }
        paint("HTML 就绪，加载运行时模块…", 10);
        window.__ktSplashHeartbeat = setInterval(function () {
          var s = Math.round((Date.now() - t0) / 1000);
          paint(
            "加载运行时模块… 已等待 " + s + "s" + (dev ? "（dev 首次启动需预构建依赖）" : ""),
            10 + Math.min(s * 2, 20)
          );
        }, 1000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
